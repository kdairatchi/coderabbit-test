name: IPI Canary (Elastic PoC)
on:
  issue_comment:
    types: [created]

permissions:
  issues: write
  pull-requests: write
  contents: read

jobs:
  canary:
    if: >-
      contains(github.event.comment.body, '@claude') &&
      github.event.issue.pull_request != null
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      PR_NUMBER: ${{ github.event.issue.number }}
      REPO: ${{ github.repository }}
    steps:
      - name: Checkout PR HEAD (mirrors elastic setupBranch)
        run: |
          git init
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${REPO}"
          git fetch origin --depth=1 "pull/${PR_NUMBER}/head:pr-branch"
          git checkout pr-branch
          echo "=== PR HEAD checked out: $(git log --oneline -1) ==="
          echo "=== .claude/ contents: ==="
          ls -la .claude/ 2>/dev/null || echo "(no .claude/ dir)"

      - name: Dump CLAUDE.md to log and post canary comment
        run: |
          CANARY="ELASTIC_IPI_CANARY_7F42D1"
          FOUND="false"
          PATH_FOUND=""

          if [ -f ".claude/CLAUDE.md" ]; then
            FOUND="true"
            PATH_FOUND=".claude/CLAUDE.md"
          elif [ -f "CLAUDE.md" ]; then
            FOUND="true"
            PATH_FOUND="CLAUDE.md"
          fi

          echo "=== CANARY STATUS: found=${FOUND} path=${PATH_FOUND} ==="

          if [ "$FOUND" = "true" ]; then
            echo "=== BEGIN CLAUDE.md CONTENT (attacker-controlled instructions) ==="
            cat "$PATH_FOUND"
            echo "=== END CLAUDE.md CONTENT ==="

            COMMENT="CONFIRMED: ${CANARY}%0A%0AFile \`${PATH_FOUND}\` was read from PR HEAD (attacker-controlled branch).%0AThis content would be loaded as Claude Code / gh-aw Copilot CLI project instructions.%0A%0ASee workflow run log for full file content."
          else
            COMMENT="NOT FOUND: ${CANARY} - no CLAUDE.md in PR HEAD"
          fi

          gh issue comment "${PR_NUMBER}" \
            --repo "${REPO}" \
            --body "${COMMENT//%0A/$'\n'}"
